# Default lua config: https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua


######################
# General/Appearence #
######################

autogenerated = 0

env = XCURSOR_SIZE, 24
#env = QT_QPA_PLATFORMTHEME, qt6ct

input{
	kb_layout = us
	kb_variant = dvorak
	
	follow_mouse = 1

	touchpad {
		natural_scroll = no
	}

}

general {
#    gaps_in = 10
#    gaps_out = 40
#    border_size = 3
#    col.active_border = rgba(8abeb7ee) rgba(b294bbee) rgba(81a2beee) 45deg
#    col.inactive_border = rgba(373b41f0)

    layout = dwindle
}

decoration {
#    rounding = 3
    
#    blur {
#        enabled = true
#        size = 0
#        passes = 3
#    }

#    drop_shadow = yes
#    shadow_range = 7
#    shadow_render_power = 3
#    col.shadow = rgba(1d1f21ee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}


###################
# Layout settings #
###################

dwindle {
#    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
#    new_is_master = true
}


